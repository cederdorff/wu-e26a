<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Siderne i chatbotten efter step 14: alle sider kan ses uden login</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .route { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0d0d0d; text-anchor: middle; }
      .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .label { font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="420" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Kan alle se -->
  <rect x="20" y="20" width="580" height="380" rx="14" fill="#eef7f0" stroke="#a7d7b4" stroke-width="1.5"/>
  <text x="44" y="54" font-size="16" font-weight="700" fill="#1f6b3a">Kan alle se</text>

  <!-- layout.jsx med sidebar -->
  <rect x="44" y="72" width="532" height="182" rx="12" fill="#f8fbf9" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="96" font-size="13" font-weight="700" fill="#374151">layout.jsx med sidebar</text>

  <rect class="card" x="60" y="110" width="240" height="56" rx="10"/>
  <text class="route" x="180" y="134">/</text>
  <text class="file" x="180" y="154">home.jsx</text>

  <rect class="card" x="318" y="110" width="240" height="56" rx="10"/>
  <text class="route" x="438" y="134">/chat/new</text>
  <text class="file" x="438" y="154">chat-new.jsx</text>

  <rect class="card" x="60" y="180" width="240" height="56" rx="10"/>
  <text class="route" x="180" y="204">/chat/:threadId</text>
  <text class="file" x="180" y="224">chat-thread.jsx</text>

  <rect class="card" x="318" y="180" width="240" height="56" rx="10"/>
  <text class="route" x="438" y="204">/chat/:threadId/edit</text>
  <text class="file" x="438" y="224">chat-thread-edit.jsx</text>

  <!-- Uden for layoutet -->
  <rect class="card" x="60" y="300" width="180" height="60" rx="10"/>
  <text class="route" x="150" y="325">/register</text>
  <text class="file" x="150" y="346">register.jsx</text>

  <rect class="card" x="360" y="300" width="180" height="60" rx="10"/>
  <text class="route" x="450" y="325">/login</text>
  <text class="file" x="450" y="346">login.jsx</text>

  <text x="60" y="386" font-size="12.5" fill="#4b5563">/login og /register står uden for layoutet, så der er ingen sidebar</text>

  <line class="flow" x1="242" y1="330" x2="357" y2="330"/>
  <rect class="pill" x="254" y="305" width="92" height="20" rx="10"/>
  <text class="label" x="300" y="319">konto oprettet</text>

  <line class="flow" x1="450" y1="298" x2="450" y2="258"/>
  <rect class="pill" x="462" y="268" width="70" height="20" rx="10"/>
  <text class="label" x="497" y="282">logget ind</text>

  <!-- Kræver login -->
  <rect x="640" y="20" width="220" height="380" rx="14" fill="#fdf1e7" stroke="#f2bf94" stroke-width="1.5"/>
  <path d="M667 44 v-3.5 a4 4 0 0 1 8 0 v3.5" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="664" y="44" width="14" height="11" rx="2" fill="#b45309"/>
  <text x="686" y="54" font-size="16" font-weight="700" fill="#9a3412">Kræver login</text>

  <rect x="665" y="150" width="170" height="104" rx="10" fill="none" stroke="#e9a46c" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="750" y="188" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">Ingen sider endnu</text>
  <text x="750" y="212" font-size="12.5" fill="#9a3412" text-anchor="middle">Chat-siderne kommer</text>
  <text x="750" y="230" font-size="12.5" fill="#9a3412" text-anchor="middle">i de næste steps</text>

  <path d="M578 163 C 615 163, 625 202, 660 202" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
</svg>
