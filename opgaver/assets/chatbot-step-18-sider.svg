<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Siderne i chatbotten efter step 18: chat-siderne kræver login</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .route { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0d0d0d; text-anchor: middle; }
      .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .label { font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="380" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Kan alle se -->
  <rect x="20" y="20" width="260" height="340" rx="14" fill="#eef7f0" stroke="#a7d7b4" stroke-width="1.5"/>
  <text x="44" y="54" font-size="16" font-weight="700" fill="#1f6b3a">Kan alle se</text>

  <rect class="card" x="50" y="84" width="200" height="60" rx="10"/>
  <text class="route" x="150" y="109">/register</text>
  <text class="file" x="150" y="130">register.jsx</text>

  <rect class="card" x="50" y="210" width="200" height="60" rx="10"/>
  <text class="route" x="150" y="235">/login</text>
  <text class="file" x="150" y="256">login.jsx</text>

  <line class="flow" x1="150" y1="146" x2="150" y2="207"/>
  <rect class="pill" x="104" y="166" width="92" height="20" rx="10"/>
  <text class="label" x="150" y="180">konto oprettet</text>

  <!-- Kræver login -->
  <rect x="320" y="20" width="540" height="340" rx="14" fill="#fdf1e7" stroke="#f2bf94" stroke-width="1.5"/>
  <path d="M347 44 v-3.5 a4 4 0 0 1 8 0 v3.5" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="344" y="44" width="14" height="11" rx="2" fill="#b45309"/>
  <text x="366" y="54" font-size="16" font-weight="700" fill="#9a3412">Kræver login</text>

  <!-- layout.jsx med sidebar -->
  <rect x="344" y="72" width="492" height="182" rx="12" fill="#fffaf5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="362" y="96" font-size="13" font-weight="700" fill="#374151">layout.jsx med sidebar</text>
  <rect x="652" y="82" width="168" height="22" rx="11" fill="#ffffff" stroke="#f2bf94"/>
  <text x="736" y="97" font-size="12.5" fill="#9a3412" text-anchor="middle">kun dine egne tråde</text>

  <rect class="card" x="360" y="110" width="220" height="56" rx="10"/>
  <text class="route" x="470" y="134">/</text>
  <text class="file" x="470" y="154">home.jsx</text>

  <rect class="card" x="600" y="110" width="220" height="56" rx="10"/>
  <text class="route" x="710" y="134">/chat/new</text>
  <text class="file" x="710" y="154">chat-new.jsx</text>

  <rect class="card" x="360" y="180" width="220" height="56" rx="10"/>
  <text class="route" x="470" y="204">/chat/:threadId</text>
  <text class="file" x="470" y="224">chat-thread.jsx</text>

  <rect class="card" x="600" y="180" width="220" height="56" rx="10"/>
  <text class="route" x="710" y="204">/chat/:threadId/edit</text>
  <text class="file" x="710" y="224">chat-thread-edit.jsx</text>

  <!-- Pile mellem felterne -->
  <line class="flow" x1="252" y1="240" x2="341" y2="240"/>
  <rect class="pill" x="263" y="214" width="70" height="20" rx="10"/>
  <text class="label" x="298" y="228">logget ind</text>

  <path d="M590 256 V322 H150 V273" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <rect class="pill" x="308" y="312" width="124" height="20" rx="10"/>
  <text x="370" y="326" font-size="12.5" fill="#c2410c" text-anchor="middle">API'et svarer 401</text>
</svg>
