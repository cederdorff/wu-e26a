<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Siderne i react-supabase-auth: hvilke alle kan se, og hvilken der kræver login</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .route { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #0d0d0d; text-anchor: middle; }
      .desc { font-size: 13px; fill: #4b5563; text-anchor: middle; }
      .label { font-size: 12.5px; fill: #4b5563; text-anchor: middle; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="380" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Kan alle se -->
  <rect x="20" y="20" width="540" height="340" rx="14" fill="#eef7f0" stroke="#a7d7b4" stroke-width="1.5"/>
  <text x="44" y="54" font-size="16" font-weight="700" fill="#1f6b3a">Kan alle se</text>

  <!-- Kræver login -->
  <rect x="600" y="20" width="260" height="340" rx="14" fill="#fdf1e7" stroke="#f2bf94" stroke-width="1.5"/>
  <path d="M627 44 v-3.5 a4 4 0 0 1 8 0 v3.5" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="624" y="44" width="14" height="11" rx="2" fill="#b45309"/>
  <text x="646" y="54" font-size="16" font-weight="700" fill="#9a3412">Kræver login</text>

  <!-- Sider -->
  <rect class="card" x="195" y="82" width="160" height="66" rx="10"/>
  <text class="route" x="275" y="111">/</text>
  <text class="desc" x="275" y="132">forsiden</text>

  <rect class="card" x="50" y="200" width="160" height="66" rx="10"/>
  <text class="route" x="130" y="229">/register</text>
  <text class="desc" x="130" y="250">opret en konto</text>

  <rect class="card" x="340" y="200" width="160" height="66" rx="10"/>
  <text class="route" x="420" y="229">/login</text>
  <text class="desc" x="420" y="250">log ind</text>

  <rect class="card" x="650" y="200" width="160" height="66" rx="10"/>
  <text class="route" x="730" y="229">/profile</text>
  <text class="desc" x="730" y="250">din profil</text>

  <!-- Pile -->
  <line class="flow" x1="240" y1="150" x2="160" y2="197"/>
  <line class="flow" x1="310" y1="150" x2="390" y2="197"/>

  <line class="flow" x1="212" y1="233" x2="337" y2="233"/>
  <rect class="pill" x="228" y="208" width="92" height="20" rx="10"/>
  <text class="label" x="274" y="222">konto oprettet</text>

  <line class="flow" x1="502" y1="233" x2="647" y2="233"/>
  <rect class="pill" x="539" y="208" width="70" height="20" rx="10"/>
  <text class="label" x="574" y="222">logget ind</text>

  <path d="M730 268 V318 H420 V271" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <rect class="pill" x="487" y="295" width="176" height="20" rx="10" stroke="#f2bf94"/>
  <text x="575" y="309" font-size="12.5" fill="#c2410c" text-anchor="middle">ikke logget ind, eller Log Out</text>
</svg>
