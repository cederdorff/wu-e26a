<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Step 17: Du og bob sender det samme request, GET /api/threads, med hvert jeres token. requireAuth sætter req.userId til jeres eget id. SQL'en filtrerer med WHERE user_id = req.userId, så du får dine egne tråde, og bob får sine</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .head { font-size: 12px; font-weight: 700; fill: #6b7280; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .me { fill: #eef7f0; stroke: #a7d7b4; stroke-width: 1.5; }
      .bob { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
      .who-me { font-size: 14px; font-weight: 700; fill: #1f6b3a; }
      .who-bob { font-size: 14px; font-weight: 700; fill: #3730a3; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #0d0d0d; }
      .mono-b { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #0d0d0d; }
      .hl { fill: #fef3c7; }
      .row-me { fill: #ffffff; stroke: #a7d7b4; stroke-width: 1; }
      .row-bob { fill: #ffffff; stroke: #c7d2fe; stroke-width: 1; }
      .row-t { font-size: 12px; fill: #0d0d0d; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="300" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <text class="head" x="110" y="30">Request</text>
  <text class="head" x="330" y="30">requireAuth</text>
  <text class="head" x="560" y="30">SQL</text>
  <text class="head" x="780" y="30">Svar</text>

  <!-- Dig -->
  <rect class="me" x="20" y="46" width="180" height="96" rx="10"/>
  <text class="who-me" x="34" y="70">Dig</text>
  <text class="mono" x="34" y="94">GET /api/threads</text>
  <rect class="hl" x="30" y="104" width="160" height="22" rx="5"/>
  <text class="mono" x="36" y="120">Bearer &lt;dit token&gt;</text>

  <rect class="card" x="240" y="46" width="180" height="96" rx="10"/>
  <text class="mono-b" x="330" y="82" text-anchor="middle">requireAuth</text>
  <text class="mono" x="330" y="112" text-anchor="middle">req.userId = dit id</text>

  <rect class="card" x="460" y="46" width="200" height="96" rx="10"/>
  <text class="mono" x="474" y="74">SELECT … FROM threads</text>
  <text class="mono" x="474" y="96">WHERE user_id =</text>
  <rect class="hl" x="470" y="104" width="110" height="22" rx="5"/>
  <text class="mono" x="476" y="120">${req.userId}</text>

  <rect class="me" x="700" y="46" width="160" height="96" rx="10"/>
  <rect class="row-me" x="712" y="58" width="136" height="22" rx="5"/>
  <text class="row-t" x="722" y="73">Min tråd</text>

  <line class="flow" x1="202" y1="94" x2="237" y2="94"/>
  <line class="flow" x1="422" y1="94" x2="457" y2="94"/>
  <line class="flow" x1="662" y1="94" x2="697" y2="94"/>

  <!-- bob -->
  <rect class="bob" x="20" y="176" width="180" height="96" rx="10"/>
  <text class="who-bob" x="34" y="200">bob</text>
  <text class="mono" x="34" y="224">GET /api/threads</text>
  <rect class="hl" x="30" y="234" width="160" height="22" rx="5"/>
  <text class="mono" x="36" y="250">Bearer &lt;bobs token&gt;</text>

  <rect class="card" x="240" y="176" width="180" height="96" rx="10"/>
  <text class="mono-b" x="330" y="212" text-anchor="middle">requireAuth</text>
  <text class="mono" x="330" y="242" text-anchor="middle">req.userId = bobs id</text>

  <rect class="card" x="460" y="176" width="200" height="96" rx="10"/>
  <text class="mono" x="474" y="204">SELECT … FROM threads</text>
  <text class="mono" x="474" y="226">WHERE user_id =</text>
  <rect class="hl" x="470" y="234" width="110" height="22" rx="5"/>
  <text class="mono" x="476" y="250">${req.userId}</text>

  <rect class="bob" x="700" y="176" width="160" height="96" rx="10"/>
  <rect class="row-bob" x="712" y="186" width="136" height="22" rx="5"/>
  <text class="row-t" x="722" y="201">Pizza toppings</text>
  <rect class="row-bob" x="712" y="213" width="136" height="22" rx="5"/>
  <text class="row-t" x="722" y="228">Weekend</text>
  <rect class="row-bob" x="712" y="240" width="136" height="22" rx="5"/>
  <text class="row-t" x="722" y="255">Funny joke</text>

  <line class="flow" x1="202" y1="224" x2="237" y2="224"/>
  <line class="flow" x1="422" y1="224" x2="457" y2="224"/>
  <line class="flow" x1="662" y1="224" x2="697" y2="224"/>
</svg>
