<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Thunder Client sender GET til /auth/v1/user på Supabase med headerne apikey og Authorization: Bearer og tokenet fra Local Storage. Supabase svarer 200 OK med brugerens id, email og role</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tab { font-size: 13px; fill: #9aa0a6; }
      .k { fill: #a8c7fa; }
      .s { fill: #f28b82; }
      .p { fill: #c4c7c5; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="260" rx="12" fill="#1f2023" stroke="#3c3d40"/>
  <line x1="520" y1="0" x2="520" y2="260" stroke="#3c3d40"/>

  <!-- Request -->
  <rect x="20" y="20" width="480" height="38" rx="8" fill="#2a2b2e"/>
  <text class="mono" x="34" y="44" font-size="14" font-weight="700" fill="#5ec27a">GET</text>
  <text class="mono" x="72" y="44" font-size="14" fill="#e3e3e3">https://dit-projekt.supabase.co/auth/v1/user</text>

  <text class="tab" x="24" y="88">Query</text>
  <text x="76" y="88" font-size="13" fill="#e3e3e3">Headers</text>
  <line x1="76" y1="96" x2="128" y2="96" stroke="#8ab4f8" stroke-width="2"/>
  <text class="tab" x="146" y="88">Auth</text>
  <text class="tab" x="190" y="88">Body</text>

  <rect x="20" y="114" width="480" height="40" rx="8" fill="none" stroke="#3c3d40"/>
  <rect x="34" y="125" width="18" height="18" rx="4" fill="#8ab4f8"/>
  <path d="M38 134 l4 4 l7 -8" stroke="#1f2023" stroke-width="2.2" fill="none"/>
  <text class="mono" x="64" y="139" font-size="14" font-weight="700" fill="#e3e3e3">apikey</text>
  <text class="mono" x="200" y="139" font-size="14" fill="#9aa0a6">sb_publishable_…</text>

  <rect x="20" y="166" width="480" height="40" rx="8" fill="#3b2f52" stroke="#b48cf2"/>
  <rect x="34" y="177" width="18" height="18" rx="4" fill="#8ab4f8"/>
  <path d="M38 186 l4 4 l7 -8" stroke="#1f2023" stroke-width="2.2" fill="none"/>
  <text class="mono" x="64" y="191" font-size="14" font-weight="700" fill="#e3e3e3">Authorization</text>
  <text class="mono" x="200" y="191" font-size="14" fill="#9aa0a6">Bearer <tspan fill="#ff6b8b">eyJhbGciOiJFUzI1NiIs…</tspan></text>

  <text x="24" y="236" font-size="13" font-style="italic" fill="#9aa0a6">access_token kopieret fra Local Storage. Intet password</text>

  <!-- Response -->
  <text x="540" y="44" font-size="14" font-weight="800" fill="#5ec27a">Status: 200 OK</text>
  <text x="660" y="44" font-size="13" fill="#9aa0a6">Size: 1.8 KB</text>
  <text class="mono p" x="540" y="88" font-size="14">{</text>
  <text class="mono" x="558" y="114" font-size="14"><tspan class="k">"id"</tspan><tspan class="p">: </tspan><tspan class="s">"8f3c2a71-5d4e-…"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="558" y="140" font-size="14"><tspan class="k">"email"</tspan><tspan class="p">: </tspan><tspan class="s">"anna@example.com"</tspan><tspan class="p">,</tspan></text>
  <text class="mono" x="558" y="166" font-size="14"><tspan class="k">"role"</tspan><tspan class="p">: </tspan><tspan class="s">"authenticated"</tspan><tspan class="p">,</tspan></text>
  <text class="mono p" x="558" y="192" font-size="14">…</text>
  <text class="mono p" x="540" y="218" font-size="14">}</text>
</svg>
