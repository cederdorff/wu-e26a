name: Push teaching pages to Canvas

on:
  push:
    branches: [main]
    paths:
      - "undervisning/**/*.md"

permissions:
  contents: read

concurrency:
  group: canvas-sync
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Push changed teaching pages to Canvas
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_COURSE_ID: ${{ secrets.CANVAS_COURSE_ID }}
          CANVAS_ACCESS_TOKEN: ${{ secrets.CANVAS_ACCESS_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: npm run canvas:push -- --apply --since="$BEFORE_SHA"
